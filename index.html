<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aufek</title>
<link rel="icon" href="pig.png">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: repeating-linear-gradient(45deg, #ffffff 0 6px, #1b1b1b 6px 8px);
    font-family: "Courier New", Courier, monospace;
  }
  .card {
    background: #fff; border: 4px solid #000;
    width: min(320px, 75vw); aspect-ratio: 1 / 1; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .card img {
    width: min(140px, 35vw); height: auto; display: block; margin: 0 auto;
    image-rendering: pixelated;
  }
  .card p {
    margin: 8px 0 0; font-size: clamp(20px, 5vw, 32px);
    font-weight: bold; letter-spacing: 0.15em; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="pig.png" alt="aufek pig">
    <p>Coming soon</p>
  </div>
</body>
</html>
