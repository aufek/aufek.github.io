<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aufek</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #111111;
      color: #f2f2f2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 2rem;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
    }

    h1 {
      font-size: clamp(2.75rem, 8vw, 5.5rem);
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    p {
      font-size: clamp(0.95rem, 2.4vw, 1.15rem);
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: lowercase;
      color: #8a8a8a;
    }
  </style>
</head>
<body>
  <main>
    <h1>aufek</h1>
    <p>coming soon</p>
  </main>
</body>
</html>
