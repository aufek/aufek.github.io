<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aufek</title>
<link rel="icon" href="pig.png">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #fff; overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, Roboto, sans-serif;
  }
  body::before {
    content: ""; position: fixed; top: -40px; left: -40px; right: -40px; bottom: -40px;
    background: repeating-linear-gradient(45deg, #ffffff 0 6px, #1b1b1b 6px 8px);
    animation: drift 1s linear infinite; will-change: transform; z-index: -1;
  }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-11.3137px); } }
  @media (prefers-reduced-motion: reduce) { body::before { animation: none; } }
  .card {
    position: relative;
    background: #fff; border: 3px solid #000;
    padding: 20px 30px 24px; text-align: center;
    max-width: 80vw;
  }
  .card img {
    width: min(100px, 25vw); height: auto; display: block; margin: 0 auto;
    image-rendering: pixelated;
  }
  .card p {
    margin: 8px 0 0; font-size: clamp(15px, 3.6vw, 22px);
    font-weight: 900; letter-spacing: 0.15em; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="pig.png" alt="aufek pig">
    <p>Coming soon</p>
  </div>
</body>
</html>
